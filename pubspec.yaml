name: galaxy_ai
description: "A Pinterest-style photo discovery app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-162.1.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Required packages
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  clerk_flutter: ^0.0.13-beta
  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.5.2
  google_sign_in: ^7.2.0
  flutter_cache_manager: ^3.4.1
  share_plus: ^12.0.1
  image_picker: ^1.2.1
  permission_handler: ^12.0.1
  google_mlkit_image_labeling: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # App icon and splash screen generators
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/logo.png
    - assets/applogo.png
    - assets/canvas/

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/applogo.png"
  min_sdk_android: 21
  
  # iOS specific - ensure white background
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  
  # Android adaptive icon with white background
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/applogo.png"
  
# Splash Screen Configuration  
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/logo.png
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    image: assets/logo.png
